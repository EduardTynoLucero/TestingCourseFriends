plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    id 'io.qameta.allure' version '2.12.0' 
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // This dependency is used by the application.
    implementation libs.guava
    
    // Dependencia de Selenium WebDriver
    implementation 'org.seleniumhq.selenium:selenium-java:4.16.1'

    // Dependencia de WebDriverManager para gestionar los drivers automáticamente
    implementation 'io.github.bonigarcia:webdrivermanager:5.6.2'

    // Dependencia de TestNG para pruebas
    testImplementation 'org.testng:testng:7.5.1'

    implementation 'org.json:json:20210307'

    implementation 'org.apache.poi:poi-ooxml:5.2.3'
    implementation 'org.apache.poi:poi:5.2.3'

     // Dependencia de AspectJ Weaver para soportar las anotaciones de Allure
    testImplementation 'org.aspectj:aspectjweaver:1.9.22.1'
  // BOM de Log4j
    implementation platform('org.apache.logging.log4j:log4j-bom:2.17.1')

    // Dependencias de Log4j
implementation 'org.apache.logging.log4j:log4j-api:2.20.0'
implementation 'org.apache.logging.log4j:log4j-core:2.20.0'
implementation 'org.apache.logging.log4j:log4j-slf4j-impl:2.20.0'
    
    
}

testing {
    suites {
        // Configure the built-in test suite
        test {
            // Use TestNG test framework
            useTestNG('7.5.1')
        }
    }
}

allure {
    version = '2.12.0' // Especifica la versión de Allure que deseas utilizar
    autoconfigure = true
    aspectjweaver = true
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'org.example.App'
}
